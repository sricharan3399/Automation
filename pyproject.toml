[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "av-test-automation"
version = "1.0.0"
description = "Human-in-the-loop autonomous-vehicle test automation platform (dashboard driven)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Internal Use Only" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0.30",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "shapely>=2.0.4",
    "python-dateutil>=2.9.0",
    "psutil>=5.9.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9.0"]
gis = ["geopandas>=0.14.0"]
postgres = ["psycopg[binary]>=3.1.18", "GeoAlchemy2>=0.15.0"]
browser = ["playwright>=1.44.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
av-scout = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung run must fail the build rather than occupy a CI runner indefinitely.
addopts = "-q --strict-markers --timeout=300 --timeout-method=thread"
markers = [
    "integration: integration-level tests against mock connectors",
    "slow: long running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "dashboard", "data", "output", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["backend"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
exclude = "(^dashboard/|^data/|^output/)"
