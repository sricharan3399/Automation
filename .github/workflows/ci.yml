name: CI

# --------------------------------------------------------------------------
# This workflow runs on GitHub-hosted runners, which must NEVER be able to
# reach production AV data. Every job here runs entirely offline against the
# synthetic golden dataset. Connecting to an internal data source requires an
# approved self-hosted runner and is deliberately not configured here.
# --------------------------------------------------------------------------

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Force the offline posture for every job.
  AV_MODE: production
  AV_DATASCOUT_ENABLED: 'false'
  AV_ALLOW_PRODUCTION_SUBMISSION: 'false'
  AV_REDACTION_SALT: ci-fixed-salt-not-a-secret
  PYTHONUTF8: '1'

jobs:
  backend:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy
        continue-on-error: true

      - name: Regenerate the golden dataset and verify determinism
        run: |
          python tests/golden_dataset/generate.py
          git diff --exit-code --stat tests/golden_dataset || \
            (echo "::error::The golden dataset generator is not deterministic." && exit 1)

      - name: Unit and integration tests
        run: pytest -q --cov=backend --cov-report=term-missing

      - name: Headless dry run against the local adapter
        run: python -m backend.cli run --country DE --object bus --preview-only

      - name: Headless full run and output verification
        run: |
          python -m backend.cli init-db
          python -m backend.cli run --country DE --object bus --execute --limit 5
          test -f "$(ls -d output/run_* | head -1)/summary.json"
          test -f "$(ls -d output/run_* | head -1)/validation_report.json"
          test -f "$(ls -d output/run_* | head -1)/evidence_manifest.csv"
          test -f "$(ls -d output/run_* | head -1)/audit.jsonl"

      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$|_rsa$'; then
            echo "::error::A credential-like file is tracked in git."
            exit 1
          fi

  audit:
    name: Repository security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The audit classifies findings with `git check-ignore`, which needs
          # the real working tree rather than a shallow export.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit the repository
        run: python scripts/repository_audit.py

      - name: Audit the committed tree as if freshly staged
        run: |
          git add -A
          python scripts/repository_audit.py --staged

      - name: Confirm sensitive paths are ignored
        run: |
          set -e
          for path in .env data/local.db output/results.csv .runtime/setup_state.json secrets.json id_rsa; do
            if ! git check-ignore -q -- "$path"; then
              echo "::error::'$path' is NOT ignored by .gitignore"
              exit 1
            fi
          done
          echo "All sensitive paths are correctly ignored."

  deployment:
    name: Windows deployment scripts
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error::$($_.Name) has $($errors.Count) parse error(s)"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Environment validation runs
        shell: pwsh
        run: .\scripts\validate_environment.ps1

      - name: Headless first-time setup
        shell: cmd
        run: SETUP_AND_START.bat -NoStart -NoShortcut -SkipDashboard < NUL

      - name: Verify setup produced a working installation
        shell: pwsh
        run: |
          if (-not (Test-Path '.venv\Scripts\python.exe')) { throw '.venv was not created' }
          if (-not (Test-Path 'data\local.db'))            { throw 'database was not created' }
          if (-not (Test-Path '.env'))                     { throw '.env was not created' }
          if (-not (Test-Path '.runtime\setup_state.json')){ throw 'setup state was not written' }
          Write-Host 'Setup artefacts present.'

      - name: Start, health check, stop
        shell: pwsh
        run: |
          .\scripts\start_dashboard.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'start_dashboard.ps1 failed' }
          $health = Invoke-RestMethod http://127.0.0.1:8000/health -TimeoutSec 20
          Write-Host "health: $($health | ConvertTo-Json -Compress)"
          if ($health.status -ne 'healthy') { throw "unhealthy: $($health.status)" }
          .\scripts\stop_dashboard.ps1
          if ($LASTEXITCODE -ne 0) { throw 'stop_dashboard.ps1 failed' }

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict || true

      - name: Static security analysis
        run: |
          pip install bandit
          # Scans scripts/ as well as backend/ - repository_audit.py is itself
          # security-relevant code. No exclusions: the previous exemption for
          # connectors/synthetic.py was verified unnecessary, and a narrower
          # exclusion list is a stronger gate.
          # -ll gates on MEDIUM and above. The remaining LOW findings are
          # fixed-argument subprocess calls (nvidia-smi, git) and mypy
          # type-narrowing asserts that guard no security invariant.
          bandit -r backend scripts -ll

      - name: Check that AV media is not committed
        run: |
          if git ls-files | grep -Ei '\.(mp4|avi|mkv|h264|pcap|bag|mcap|pcd|las|laz)$'; then
            echo "::error::Raw AV media must never be committed."
            exit 1
          fi
