# ---------------------------------------------------------------------------
# Fallback taxonomy.
#
# IMPORTANT: this file is a FALLBACK ONLY.
#
# When a data source is connected, the platform calls
# `adapter.get_supported_filters()` and the dashboard dropdowns are populated
# from the SOURCE taxonomy. These values are only used when the source cannot
# describe its own vocabulary, and every entry is returned to the UI with
# `origin: "fallback"` so the tester can see that it was not source-derived.
# ---------------------------------------------------------------------------

