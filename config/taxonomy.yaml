# Abnormality categories written to the CSV. The first block is the controlled
# vocabulary from the platform specification; BEHAVIOR and CSV are documented
# platform extensions (behaviour candidates and export-validation findings are
# first-class outputs here and need somewhere truthful to live).
abnormality_category:
  - PERCEPTION
  - TRACKING
  - SENSOR
  - SYNCHRONIZATION
  - LOCALIZATION
  - MAP
  - GEOMETRY
  - TIMESTAMP
  - PLANNING
  - PREDICTION
  - TRAFFIC_CONTROL
  - DATA_QUALITY
  - ANNOTATION
  - METADATA
  - DUPLICATE
  - OTHER
  - BEHAVIOR
  - CSV

# Rule-catalogue categories shown on the Validation Rules page. These group
# rules for the tester; they are NOT the same vocabulary as
# `abnormality_category`, which is what the CSV records.
