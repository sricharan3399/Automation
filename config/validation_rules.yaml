# ---------------------------------------------------------------------------
# Validation rule catalogue.
#
# Every rule declares:
#   enabled          - whether the rule runs
#   severity         - BLOCKING | ERROR | WARNING | INFO
#   blocks_processing- stop the per-event pipeline when the rule fails
#   blocks_export    - the record cannot be exported to the production CSV
#   requires_review  - route to the human review queue on failure
#   threshold        - numeric threshold, or `null` when none applies
#   threshold_source - config | project | none
#   version          - rule version, recorded on every result for reproducibility
#
# IMPORTANT
# Rules whose threshold_source is `project` require an APPROVED project value.
# They ship DISABLED, and the dashboard shows them as
# "AWAITING APPROVED PROJECT THRESHOLD". The platform never invents a
# safety-relevant threshold.
# ---------------------------------------------------------------------------

catalogue_version: "1.0.0"

rules:

  # =========================================================================
  # TEMPORAL
  # =========================================================================
  - id: TEMPORAL_EVAL_WINDOW_ORDER
    category: TEMPORAL
    description: "The evaluation window must start before it ends."
    inputs: [evaluation_start, evaluation_end]
    enabled: true
    severity: BLOCKING
    blocks_processing: true
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  - id: TEMPORAL_EVENT_IN_WINDOW
    category: TEMPORAL
    description: "The approximate event time must fall inside the evaluation window."
    inputs: [event_time, evaluation_start, evaluation_end]
    enabled: true
    severity: ERROR
    blocks_processing: false
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  - id: TEMPORAL_DISTANCE_MARKER_ORDER
    category: TEMPORAL
    description: >-
      Approach markers must be ordered along travel direction:
      200 m < 100 m < 60 m < junction entry < junction exit.
    inputs: [timestamp_200m, timestamp_100m, timestamp_60m, junction_entry_time, junction_exit_time]
    enabled: true
    severity: ERROR
    blocks_processing: false
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.1"

  - id: TEMPORAL_ENTRY_BEFORE_EXIT
    category: TEMPORAL
    description: "Junction entry must precede junction exit."
    inputs: [junction_entry_time, junction_exit_time]
    enabled: true
    severity: ERROR
    blocks_processing: false
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  - id: TEMPORAL_WAIT_LINE_BEFORE_ENTRY
    category: TEMPORAL
    description: "Wait-line crossing must occur at or before junction entry."
    inputs: [wait_line_crossing_time, junction_entry_time]
    enabled: true
    severity: WARNING
    blocks_processing: false
    blocks_export: false
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  - id: TEMPORAL_FIRST_SEEN_BEFORE_FULL_VIEW
    category: TEMPORAL
    description: "An object must be first visible at or before it is fully visible."
    inputs: [first_visible_time, full_view_time]
    enabled: true
    severity: ERROR
    blocks_processing: false
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  - id: TEMPORAL_WITHIN_SOURCE_DURATION
    category: TEMPORAL
    description: "Every derived timestamp must lie inside the recorded source duration."
    inputs: [all_timestamps, source_start, source_end]
    enabled: true
    severity: BLOCKING
    blocks_processing: false
    blocks_export: true
    requires_review: true
    threshold: null
    threshold_source: none
    version: "1.0"

  # =========================================================================
  # GEOMETRY
  # =========================================================================
  - id: GEOMETRY_POLYGON_MIN_POINTS
